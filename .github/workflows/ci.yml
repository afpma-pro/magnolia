name: CI
on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [scala3-v*]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    env:
      JAVA_OPTS: -Xmx4G
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Cache sbt
        uses: coursier/cache-action@v6

      - name: Compile
        run: sbt +compile

      - name: Run tests
        run: sbt +test

  mima:
    name: Check Binary Compatibility
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    env:
      JAVA_OPTS: -Xmx4G
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Cache sbt
        uses: coursier/cache-action@v6

      - name: Check MiMa
        run: sbt core/mimaReportBinaryIssues || echo "MiMa check skipped or not configured"
        continue-on-error: true

  publish:
    name: Publish release
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/scala3-v'))
    runs-on: ubuntu-22.04
    env:
      STTP_NATIVE: 1
      JAVA_OPTS: -Xmx4G
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Cache sbt
        uses: coursier/cache-action@v6

      - name: Publish artifacts
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Extract version from tag
        run: |
          version=${GITHUB_REF/refs\/tags\/scala3-v/}
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softwaremill/release-drafter@v5
        with:
          config-name: release-drafter.yml
          publish: true
          name: "v${{ env.VERSION }}"
          tag: "scala3-v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
